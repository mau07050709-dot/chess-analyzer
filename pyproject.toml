[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analizador-ajedrez"
version = "0.1.0"
description = "Prototipo local de análisis de ajedrez con Stockfish"
requires-python = ">=3.12"
dependencies = ["python-chess==1.999", "chess==1.11.2", "PySide6==6.12.0", "numpy==2.3.3", "onnxruntime==1.31.0"]

[project.scripts]
ajedrez = "ajedrez.__main__:main"
ajedrez-gui = "ajedrez.ui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


